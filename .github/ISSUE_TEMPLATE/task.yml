name: 작업
description: 문서, 유지보수, 리팩터링 등 일반 작업을 정의합니다.
title: "[Task] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        이슈 하나는 하나의 작업 브랜치와 하나의 `dev` 대상 PR로 완료합니다.
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 이 작업이 필요한 이유와 현재 상황을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함할 변경과 제외할 변경을 구체적으로 적어 주세요.
      placeholder: |
        - [ ] 구현 또는 변경 사항
        - [ ] 테스트
        - [ ] 문서 갱신
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 리뷰어가 완료 여부를 판단할 수 있는 조건을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
      description: 실행할 테스트, 분석, 빌드 또는 수동 확인을 적어 주세요.
    validations:
      required: true
